<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÀN HÌNH ĐÁP ÁN CỬA 4 - DOOR 4 SCREEN</title>
    <style>
        @font-face {
            font-family: 'Myriad Pro';
            src: local('Myriad Pro'), local('MyriadPro-Regular'), local('MyriadPro');
        }

        @font-face {
            font-family: 'Myriad Pro Bold';
            src: local('Myriad Pro Bold'), local('MyriadPro-Bold'), local('Myriad Pro');
            font-weight: bold;
        }

        @font-face {
            font-family: 'LHF_Mono';
            src: url('LHF_Mono.otf') format('opentype'), url('LHF Mono.otf') format('opentype');
        }

        @font-face {
            font-family: 'UVN Thanh Pho Nang';
            src: url('unicode.display.UVNThanhPhoNang.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Myriad Pro', Arial, sans-serif;
            background-color: #000;
            color: #fff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
        }

        .door-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .door-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .door-frame {
            width: 100vw;
            height: 100vh;
            position: relative;
            border: none;
            overflow: hidden;
            background: #000;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
        }

        .unused-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('unusedoor.png');
            background-size: 100% 100%; background-repeat: no-repeat;
            z-index: 10;
            display: none;
            pointer-events: auto;
        }
        .unused-overlay.active {
            display: block;
        }

        .bottom-bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('indoor.png');
            background-size: 100% 100%; background-repeat: no-repeat; z-index: 1;
            transition: background-image 0.2s ease;
        }

        .bottom-bg-layer.collapsed-bg {
            background-image: url('dropdoor.png') !important;
        }

        /* TEXT ĐÁP ÁN TRÊN NỀN INDOOR.PNG (CĂN GIỮA TRUNG TÂM GRAPHIC) */
        .answer-text-inside {
            position: absolute; top: 51%; left: 50%; transform: translate(-50%, -50%) scale(0.3);
            width: 90%; height: 72%;
            display: flex; align-items: center; justify-content: center; padding: 0; margin: 0;
            font-size: clamp(64px, 14vw, 210px); font-weight: bold; text-align: center; color: #ffffff;
            font-family: 'Myriad Pro Bold', 'Myriad Pro', Arial, sans-serif;
            text-shadow: 0 3px 6px rgba(0,0,0,0.6); z-index: 2;
            opacity: 0;
            transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); pointer-events: none;
            word-break: break-word;
            line-height: 1.15;
            box-sizing: border-box;
        }
        .answer-text-inside.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .answer-text-inside.hide-on-drop { opacity: 0 !important; transform: translate(-50%, -50%) scale(0.3) !important; transition: all 0.2s ease !important; }

        .fall-status-text {
            position: absolute; top: 51%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; height: 72%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px;
            color: #ff3333; font-size: clamp(48px, 9vw, 140px); font-weight: normal; text-align: center;
            text-transform: uppercase; line-height: 1.1; z-index: 2;
            text-shadow: none;
            opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
            font-family: 'UVN Thanh Pho Nang', sans-serif;
            box-sizing: border-box;
        }
        .fall-status-text.active { opacity: 1; }

        /* LỚP BỀ MẶT CỬA DOOR.PNG (CHẬM THÊM 0.25S -> 1.0S) */
        .door-surface {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3;
            display: flex; transition: transform 1.0s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .door-wing {
            width: 50%; height: 100%; background-size: 200% 100%; background-position: left center;
            background-image: url('door.png'); transition: transform 1.0s cubic-bezier(0.25, 1, 0.5, 1), background-image 0.2s ease; background-repeat: no-repeat;
        }
        .door-wing.right { background-position: right center; }

        .door-surface.wiped .door-wing.left { transform: translateX(-100%); }
        .door-surface.wiped .door-wing.right { transform: translateX(100%); }

        .door-surface.closing { transition: transform 1.0s ease-in-out !important; }
        .door-surface.closing .door-wing { transform: translateX(0) !important; }

        .door-surface.dropped { display: none; }

        .v-split-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 8; pointer-events: none; overflow: hidden; display: none;
        }
        .v-split-container.active {
            display: block;
        }

        .v-panel {
            position: absolute; top: 0; width: 50%; height: 100%;
            background-image: url('door.png');
            background-size: 200% 100%;
            background-repeat: no-repeat;
            transition: transform 1.0s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .v-panel.left {
            left: 0; background-position: left center;
            transform: translateX(-100%);
            border-right: 2px solid rgba(0,0,0,0.7);
        }
        .v-panel.right {
            right: 0; background-position: right center;
            transform: translateX(100%);
            border-left: 2px solid rgba(0,0,0,0.7);
        }

        .v-split-container.split-in .v-panel.left {
            transform: translateX(0) !important;
        }
        .v-split-container.split-in .v-panel.right {
            transform: translateX(0) !important;
        }

        .v-split-container.split-out .v-panel.left {
            transform: translateX(-100%) !important;
        }
        .v-split-container.split-out .v-panel.right {
            transform: translateX(100%) !important;
        }

        .bg-moneydoor { background-image: url('moneydoor.png') !important; }

        .bet-box {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 12%;
            background: transparent;
            border: none;
            box-shadow: none;
            display: flex; align-items: center; justify-content: center;
            z-index: 12; opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .bet-box.show { opacity: 1; }
        .bet-amount {
            font-size: clamp(84px, 13.5vh, 216px); font-weight: normal; color: #ffffff;
            font-family: 'UVN Thanh Pho Nang', sans-serif;
            letter-spacing: 2px; text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            transform: translateY(-36px);
        }
    </style>
</head>
<body>

    <div class="door-container">
        <div class="door-wrapper" id="ans-wrap-4">
            <div class="door-frame">
                <div class="unused-overlay" id="unused-4"></div>
                <div class="bottom-bg-layer" id="bg-layer-4"></div>
                <div class="answer-text-inside" id="inside-txt-4"></div>
                <div class="fall-status-text" id="fall-txt-4"></div>
                <div class="v-split-container" id="v-split-4">
                    <div class="v-panel left" id="v-panel-left-4"></div>
                    <div class="v-panel right" id="v-panel-right-4"></div>
                </div>
                <div class="door-surface" id="surface-4">
                    <div class="door-wing left" id="wing-l-4"></div>
                    <div class="door-wing right" id="wing-r-4"></div>
                </div>
                <div class="bet-box" id="bet-box-4">
                    <span class="bet-amount" id="bet-val-4">0 $A</span>
                </div>
            </div>
        </div>
    </div>

    <script src="network_sync.js"></script>
    <script src="security.js"></script>
    <script>
        window.DOOR_ID = 4;
    </script>
    <script src="answer_single.js"></script>
</body>
</html>
