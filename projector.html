<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Projector Interface - Full Flow with Clock</title>
    <style>
        @font-face {
            font-family: 'LHF_Mono';
            src: url('LHF_Mono.otf') format('opentype'), url('LHF Mono.otf') format('opentype');
        }

        @font-face {
            font-family: 'UVN Thanh Pho Nang';
            src: url('unicode.display.UVNThanhPhoNang.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Myriad Pro', Arial, sans-serif; font-weight: bold; pointer-events: none !important; user-select: none; }
        .projector-container { 
            width: 1920px; height: 1080px; position: relative; margin: auto;
            background-color: #000; overflow: hidden;
            pointer-events: none !important;
            user-select: none;
        }
        .bg-base { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; z-index: 0; pointer-events: none; }
        .bg-main { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; transition: opacity 0.5s ease; }
        .bg-main.hide { opacity: 0; }
        .bg-outline { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 90; pointer-events: none; }

        :root {
            --q-center-top: 540px;
            --q-moved-top: 412px; /* Căn giữa giữa mép trên khung màn hình và mép trên 4 đáp án */
            --ans-container-top: 480px;
            --clock-top: 610px;   /* THÔNG SỐ VỊ TRÍ CLOCK */
        }

        /* Performance Optimization: GPU Compositing for Smooth Rendering */
        #central-box, #answers-container, .ans-frame, #clock-container, #media-container, .strap-wrapper, #progress-hud-overlay, #winning-money-overlay {
            will-change: transform, opacity;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .strap-wrapper { position: absolute; left: 50%; transform: translateX(-50%); z-index: 5; width: 1000px; transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); cursor: default; pointer-events: none; }
        .category-strap { width: 100%; height: auto; display: block; }
        .strap-text { 
            position: absolute; top: 0; left: 50%; transform: translateX(-50%); 
            width: 88%; height: 100%;
            display: flex; align-items: center; justify-content: center; text-align: center;
            color: white; font-size: 32px; font-weight: bold; pointer-events: none; 
            font-family: 'Myriad Pro', Arial, sans-serif; line-height: 1.2;
        }
        .is-active { top: 50% !important; z-index: 20; transform: translate(-50%, -50%) scale(1.1) !important; }
        .zoom-out { top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) scale(0) !important; opacity: 0; }

        #central-box { position: absolute; top: var(--q-center-top); left: 50%; transform: translate(-50%, -50%) scale(0); width: 1200px; z-index: 5; color: white; font-size: 51px; text-align: center; transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; cursor: default; pointer-events: none; font-family: 'Myriad Pro', Arial, sans-serif; font-weight: bold; }
        #central-box.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        #central-box.move-up { top: var(--q-moved-top); transform: translate(-50%, -50%) scale(1); width: 1180px; font-size: 35px; line-height: 1.35; font-weight: bold; }

        /* Media Question Modes for Central Box */
        #central-box.media-q-mode {
            top: 505px !important;
            left: calc(50% + 140px) !important;
            transform: translate(-50%, -50%) scale(1) !important;
            width: 560px !important;
            font-size: 43px !important;
            line-height: 1.3 !important;
            text-align: left !important;
            opacity: 1 !important;
        }

        #central-box.media-qa-mode {
            top: 475px !important;
            left: calc(50% + 140px) !important;
            transform: translate(-50%, -50%) scale(1) !important;
            width: 560px !important;
            font-size: 29px !important;
            line-height: 1.25 !important;
            text-align: center !important;
            opacity: 1 !important;
        }

        /* --- MEDIA CONTAINER STYLES --- */
        #media-container {
            position: absolute;
            z-index: 10;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            overflow: hidden;
            padding: 0;
            box-sizing: border-box;
            border: none;
            background: transparent;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            opacity: 0;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
        }

        #media-container.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Phase 1: Center Zoomed */
        #media-container.mode-center {
            top: 505px;
            left: 50%;
            width: 260px;
            height: 260px;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Phase 2: Shifted to Left */
        #media-container.mode-left {
            top: 505px;
            left: calc(50% - 320px);
            width: 210px;
            height: 210px;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Phase 3: Shifted to Left Compact */
        #media-container.mode-left-compact {
            top: 505px;
            left: calc(50% - 340px);
            width: 180px;
            height: 180px;
            transform: translate(-50%, -50%) scale(1);
        }

        #media-img, #media-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 6px;
            max-width: 100%;
            max-height: 100%;
        }

        #answers-container { position: absolute; top: var(--ans-container-top); left: 50%; transform: translateX(-50%) scale(0); width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 5; transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; }
        #answers-container.show { transform: translateX(-50%) scale(1); opacity: 1; }

        /* Media Answers Mode for Phase 3 */
        #answers-container.media-mode {
            top: 570px !important;
            left: calc(50% + 140px) !important;
            transform: translate(-50%, -50%) scale(1) !important;
            width: 560px !important;
            display: flex !important;
            justify-content: center !important;
            gap: 8px !important;
            opacity: 1 !important;
        }

        #answers-container.media-mode .ans-frame {
            width: 128px !important;
            height: 80px !important;
        }

        #answers-container.media-mode .ans-text {
            font-size: 15px !important;
            padding: 0 4px !important;
            line-height: 1.15 !important;
        }
        
        .ans-frame { width: 280px; height: 150px; position: relative; transition: all 0.5s ease; }
        .ans-frame.dropped {
            filter: brightness(0.2) grayscale(0.8);
            opacity: 0.25;
        }
        .ans-img { width: 100%; height: 100%; }
        .ans-text { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            color: white; font-size: 29px; font-weight: bold; width: 100%; text-align: center; 
            display: flex; justify-content: center; align-items: center; padding: 0 12px; 
            box-sizing: border-box; pointer-events: none; font-family: 'Myriad Pro', Arial, sans-serif;
            line-height: 1.2;
        }

        /* --- CLOCK STYLES --- */
        #clock-container {
            position: absolute; top: var(--clock-top); left: 50%; transform: translateX(-50%) scale(0.75);
            width: 300px; height: 100px; z-index: 5; transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0;
        }
        #clock-container.show { transform: translateX(-50%) scale(0.75); opacity: 1; }
        #clock-bg { width: 100%; height: 100%; }
        #clock-time { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 40px; font-weight: normal; font-family: 'UVN Thanh Pho Nang', sans-serif; }

        /* --- PROGRESS HUD OVERLAY --- */
        #progress-hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 70;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 0;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        #progress-hud-overlay.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .progress-capsule {
            position: relative;
            width: 1650px;
            height: 450px;
            background: radial-gradient(ellipse at center, #5c0f0f 0%, #300505 60%, #150202 100%);
            border-radius: 225px;
            border: 12px solid #d0d0d0;
            box-shadow: 0 0 0 6px #4a4a4a, inset 0 0 55px rgba(0,0,0,0.85), 0 30px 70px rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 60px;
            box-sizing: border-box;
        }

        .progress-remaining-text {
            color: #ffffff;
            font-size: 38px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 3px 10px rgba(0,0,0,0.9);
            margin-bottom: 18px;
            font-family: 'Myriad Pro', Arial, sans-serif;
            line-height: 1;
        }

        .progress-money-text {
            color: #ffffff;
            font-size: 96px;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 0 5px 20px rgba(0,0,0,0.9), 0 0 30px rgba(255,255,255,0.25);
            margin-top: 20px;
            font-family: 'UVN Thanh Pho Nang', sans-serif;
            line-height: 1;
        }

        .progress-slots-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .progress-slot {
            width: 118px;
            height: 118px;
            border-radius: 20px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 22px rgba(0,0,0,0.7);
            overflow: hidden;
            font-family: 'Myriad Pro', Arial, sans-serif;
            font-size: 68px;
            font-weight: bold;
            color: #ffffff;
        }

        .progress-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .progress-slot .slot-number {
            position: relative;
            z-index: 2;
            text-shadow: 0 4px 10px rgba(0,0,0,0.85);
        }

        .progress-slot.played-slot {
            background: #ffffff;
            border: 4px solid #ffffff;
        }

        .progress-slot.unplay-slot {
            background: linear-gradient(180deg, #c0292b 0%, #7a0909 100%);
            border: 4px solid #e74c3c;
            box-shadow: inset 0 4px 8px rgba(255,255,255,0.4), 0 10px 22px rgba(0,0,0,0.7);
        }

        .progress-gauge-icon {
            width: 118px;
            height: 118px;
            border-radius: 50%;
            background: radial-gradient(circle, #2a2a2a 0%, #111111 80%);
            border: 6px solid #d0d0d0;
            box-shadow: inset 0 0 14px #000, 0 8px 18px rgba(0,0,0,0.8);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* --- WINNING MONEY OVERLAY (CENTER SCREEN) --- */
        #winning-money-overlay {
            position: absolute;
            top: 46%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            z-index: 85;
            pointer-events: none;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #winning-money-overlay.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }
        #winning-money-text {
            font-family: 'UVN Thanh Pho Nang', sans-serif;
            font-size: 110px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.9), 0 0 12px rgba(0, 0, 0, 0.9), 0 5px 25px rgba(0, 0, 0, 1), 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
            white-space: nowrap;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="projector-container" onclick="unlockAudio()">
        <img src="main1.png" class="bg-base">
        <img src="mainscreen.png" class="bg-main">
        <img src="outlinescreen.png" class="bg-outline">

        <!-- Progress HUD Overlay -->
        <div id="progress-hud-overlay">
            <div class="progress-capsule">
                <div class="progress-remaining-text" id="prog-remaining-val">CÒN 8 CÂU HỎI PHÍA TRƯỚC</div>
                <div class="progress-slots-row" id="prog-slots-container">
                    <!-- Rendered dynamically -->
                </div>
                <div class="progress-money-text" id="prog-money-val">1.000.000 $A</div>
            </div>
        </div>

        <!-- Winning Money Overlay (Center Screen) -->
        <div id="winning-money-overlay">
            <div id="winning-money-text">0 $A</div>
        </div>

        <div id="central-box">CHỜ MC CHỌN CHỦ ĐỀ...</div>

        <!-- Media Container for Image & Video Questions -->
        <div id="media-container" class="mode-center">
            <img id="media-img" src="" style="display:none;" alt="Media Question">
            <video id="media-video" style="display:none;" playsinline></video>
        </div>

        <div id="answers-container">
            <div class="ans-frame" id="proj-frame-1"><img src="indoor.png" class="ans-img"><div class="ans-text" id="proj-ans-1">---</div></div>
            <div class="ans-frame" id="proj-frame-2"><img src="indoor.png" class="ans-img"><div class="ans-text" id="proj-ans-2">---</div></div>
            <div class="ans-frame" id="proj-frame-3"><img src="indoor.png" class="ans-img"><div class="ans-text" id="proj-ans-3">---</div></div>
            <div class="ans-frame" id="proj-frame-4"><img src="indoor.png" class="ans-img"><div class="ans-text" id="proj-ans-4">---</div></div>
        </div>

        <div id="clock-container">
            <img src="clock1.png" id="clock-bg">
            <div id="clock-time">1:00</div>
        </div>

        <div class="strap-wrapper" style="top: 400px; display: none;" id="item-a" data-state="0">
            <img src="categorystrap.png" class="category-strap"><div class="strap-text">CHỦ ĐỀ A</div>
        </div>
        <div class="strap-wrapper" style="top: 550px; display: none;" id="item-b" data-state="0">
            <img src="categorystrap.png" class="category-strap"><div class="strap-text">CHỦ ĐỀ B</div>
        </div>
    </div>

    <script src="network_sync.js"></script>
    <script src="security.js"></script>
    <script>
        const channel = (typeof GameSyncChannel !== 'undefined') ? new GameSyncChannel('gameshow_money_drop') : new BroadcastChannel('gameshow_money_drop');
        let globalVolume = 1.0;
        const timerAudio = new Audio("SFX/drop_timer.mp3");
        timerAudio.loop = false;
        timerAudio.volume = globalVolume;

        let activeSfxAudio = null;
        let clickCount = 0; 
        let isAudioUnlocked = false;
        let clockHideTimeout = null;

        function unlockAudio() {
            if (!isAudioUnlocked) {
                isAudioUnlocked = true;
            }
            const video = document.getElementById('media-video');
            if (video && currentMediaState && currentMediaState.type === 'video') {
                video.muted = false;
                video.volume = globalVolume;
                if (video.paused) {
                    video.play().catch(e => console.log('Video unlock play error:', e));
                }
            }
        }

        document.addEventListener('click', unlockAudio, { passive: true });
        document.addEventListener('touchstart', unlockAudio, { passive: true });
        document.addEventListener('pointerdown', unlockAudio, { passive: true });
        document.addEventListener('keydown', unlockAudio, { passive: true });

        let lastSfxPlay = { file: '', time: 0 };

        function playSfxOnProjector(filePath, loop = false, stopPrevious = true) {
            const now = Date.now();
            if (lastSfxPlay.file === filePath && (now - lastSfxPlay.time < 200)) {
                return; // Ignore duplicate playback call within 200ms
            }
            lastSfxPlay = { file: filePath, time: now };

            if (stopPrevious && activeSfxAudio) {
                activeSfxAudio.pause();
                activeSfxAudio.currentTime = 0;
            }
            const audio = new Audio(filePath);
            audio.volume = globalVolume;
            audio.loop = loop;
            if (stopPrevious) {
                activeSfxAudio = audio;
            }
            audio.play().then(() => {
                unlockAudio();
            }).catch(e => {
                console.warn("SFX Play error/blocked on Projector:", e);
            });
        }

        let currentRound = 1;

        function applyAnswerVisibility() {
            for (let i = 1; i <= 4; i++) {
                const frame = document.getElementById(`proj-frame-${i}`);
                const textEl = document.getElementById(`proj-ans-${i}`);
                if (!frame) continue;

                let shouldShow = true;

                // Round rules:
                // Round 5,6,7 -> 3 options (hide door 1)
                // Round 8 -> 2 options (hide door 1 and 4)
                if (currentRound >= 5 && currentRound <= 7) {
                    if (i === 1) shouldShow = false;
                } else if (currentRound === 8) {
                    if (i === 1 || i === 4) shouldShow = false;
                }

                if (textEl && textEl.dataset.hiddenByContent === "true") {
                    shouldShow = false;
                }

                frame.style.display = shouldShow ? "block" : "none";
            }
        }

        function stopAllSfxOnProjector() {
            if (activeSfxAudio) {
                activeSfxAudio.pause();
                activeSfxAudio.currentTime = 0;
                activeSfxAudio = null;
            }
            timerAudio.pause();
            timerAudio.currentTime = 0;
        }

        let currentMediaState = { type: 'none', url: '' };
        let currentMediaStage = 'none';

        async function updateProjectorMediaStage(stage, mediaData) {
            if (mediaData) {
                currentMediaState = {
                    type: mediaData.mediaType || mediaData.type || 'none',
                    url: mediaData.mediaUrl || mediaData.url || '',
                    mediaKey: mediaData.mediaKey || ''
                };
            }

            const container = document.getElementById('media-container');
            const img = document.getElementById('media-img');
            const video = document.getElementById('media-video');
            const box = document.getElementById('central-box');
            const ans = document.getElementById('answers-container');

            if (!container || !img || !video) return;

            // If URL was trimmed over network to '[Local File Base64]' or starts with idb://, resolve real content from IndexedDB / Cache
            let targetUrl = currentMediaState ? currentMediaState.url : '';
            if ((!targetUrl || targetUrl === '[Local File Base64]' || targetUrl.startsWith('idb://')) && window.GameMediaCache) {
                const searchKey = (currentMediaState && currentMediaState.mediaKey) ? currentMediaState.mediaKey : 'active_main_media';
                const cachedUrl = await window.GameMediaCache.get(searchKey);
                if (cachedUrl) {
                    targetUrl = cachedUrl;
                    currentMediaState.url = cachedUrl;
                }
            }

            if (!currentMediaState || currentMediaState.type === 'none' || !targetUrl || targetUrl === '[Local File Base64]') {
                container.classList.remove('show', 'mode-center', 'mode-left', 'mode-left-compact');
                box.classList.remove('media-q-mode', 'media-qa-mode');
                ans.classList.remove('media-mode');
                video.pause();
                currentMediaStage = 'none';
                return;
            }

            currentMediaStage = stage;

            if (currentMediaState.type === 'image') {
                if (img.getAttribute('data-loaded-src') !== targetUrl) {
                    img.setAttribute('data-loaded-src', targetUrl);
                    img.src = targetUrl;
                }
                img.style.display = 'block';
                video.style.display = 'none';
                if (!video.paused) video.pause();
            } else if (currentMediaState.type === 'video') {
                video.style.display = 'block';
                img.style.display = 'none';
                
                video.loop = true;
                video.playsInline = true;
                video.volume = globalVolume;

                if (video.getAttribute('data-loaded-src') !== targetUrl) {
                    video.setAttribute('data-loaded-src', targetUrl);
                    video.src = targetUrl;
                    video.load();
                }

                if (stage === 'center') {
                    try { video.currentTime = 0; } catch(e){}
                }

                const attemptPlay = () => {
                    // Try playing with sound first, fallback to muted if autoplay policy blocks sound
                    video.muted = !isAudioUnlocked;
                    const playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            console.log("Projector video playing successfully.");
                        }).catch(err => {
                            console.warn("Projector video play restricted, forcing muted autoplay:", err);
                            video.muted = true;
                            video.play().catch(e => console.error("Projector muted video play error:", e));
                        });
                    }
                };

                if (video.paused || stage === 'center') {
                    attemptPlay();
                }
            }

            container.classList.remove('mode-center', 'mode-left', 'mode-left-compact');
            box.classList.remove('media-q-mode', 'media-qa-mode');
            ans.classList.remove('media-mode');

            if (stage === 'center') {
                container.classList.add('mode-center', 'show');
                box.classList.remove('show');
                ans.classList.remove('show');
            } else if (stage === 'left') {
                container.classList.add('mode-left', 'show');
                box.classList.add('show', 'media-q-mode');
                ans.classList.remove('show');
            } else if (stage === 'left-compact') {
                container.classList.add('mode-left-compact', 'show');
                box.classList.add('show', 'media-qa-mode');
                ans.classList.add('show', 'media-mode');
            }
        }

        function resetBigscreen() {
            // Stop all sounds so that no music plays during reset
            stopAllSfxOnProjector();
            updateProjectorMediaStage('none', { type: 'none', url: '' });

            const bgMain = document.querySelector('.bg-main');
            if (bgMain) {
                bgMain.src = "mainscreen.png";
            }

            document.getElementById("item-a").style.display = "none";
            document.getElementById("item-b").style.display = "none";

            document.getElementById("item-a").classList.remove("is-active", "zoom-out");
            document.getElementById("item-b").classList.remove("is-active", "zoom-out");

            document.getElementById("item-a").setAttribute("data-state", "0");
            document.getElementById("item-b").setAttribute("data-state", "0");

            document.getElementById("central-box").classList.remove("show", "move-up");
            document.getElementById("answers-container").classList.remove("show");
            if (clockHideTimeout) {
                clearTimeout(clockHideTimeout);
                clockHideTimeout = null;
            }
            document.getElementById("clock-container").classList.remove("show");
            const hudElReset = document.getElementById("progress-hud-overlay");
            if (hudElReset) hudElReset.classList.remove("show");
            const winOverlayReset = document.getElementById("winning-money-overlay");
            if (winOverlayReset) winOverlayReset.classList.remove("show");
            const bgMainReset = document.querySelector('.bg-main');
            if (bgMainReset) bgMainReset.classList.remove('hide');

            // Reset text and drop states
            currentRound = 1;
            document.getElementById("central-box").innerText = "CHỜ MC CHỌN CHỦ ĐỀ...";
            for (let i = 1; i <= 4; i++) {
                const ansEl = document.getElementById(`proj-ans-${i}`);
                if (ansEl) {
                    ansEl.innerText = "---";
                    delete ansEl.dataset.hiddenByContent;
                }
                const frameEl = document.getElementById(`proj-frame-${i}`);
                if (frameEl) {
                    frameEl.classList.remove("dropped");
                }
            }
            applyAnswerVisibility();

            clickCount = 0;
        }

        function applyScreenFramesVisibility(settings) {
            const show = (settings && settings.showScreenFrames !== undefined) ? settings.showScreenFrames : true;
            const bgBase = document.querySelector('.bg-base');
            const bgOutline = document.querySelector('.bg-outline');
            if (bgBase) bgBase.style.display = show ? 'block' : 'none';
            if (bgOutline) bgOutline.style.display = show ? 'block' : 'none';
        }

        channel.onmessage = function(event) {
            const { action, data } = event.data;

            switch(action) {
                case "update_settings":
                    if (data && data.settings) {
                        applyScreenFramesVisibility(data.settings);
                    }
                    break;
                case "set_volume":
                    if (data && data.volume !== undefined) {
                        globalVolume = Math.max(0, Math.min(1, parseFloat(data.volume)));
                        timerAudio.volume = globalVolume;
                        if (activeSfxAudio) {
                            activeSfxAudio.volume = globalVolume;
                        }
                    }
                    break;

                case "play_sfx":
                    if (data && data.file) {
                        playSfxOnProjector(data.file, !!data.loop, data.stopPrevious !== false);
                    }
                    break;

                case "stop_sfx":
                    stopAllSfxOnProjector();
                    break;

                case "reset_round":
                    resetBigscreen();
                    break;

                case "show_progress":
                    let remCount = 0;
                    if (data && data.remainingCount !== undefined) {
                        remCount = data.remainingCount;
                    } else if (data && Array.isArray(data.questionStates)) {
                        remCount = data.questionStates.filter(s => !s).length;
                    }
                    const remValEl = document.getElementById('prog-remaining-val');
                    if (remValEl) {
                        remValEl.innerText = `CÒN ${remCount} CÂU HỎI PHÍA TRƯỚC`;
                    }

                    const moneyValEl = document.getElementById('prog-money-val');
                    if (moneyValEl && data && data.totalMoneyText) {
                        moneyValEl.innerText = data.totalMoneyText;
                    }

                    const slotsContainer = document.getElementById('prog-slots-container');
                    if (slotsContainer && data && Array.isArray(data.questionStates)) {
                        slotsContainer.innerHTML = '';
                        const qStates = data.questionStates;
                        
                        for (let i = 0; i < qStates.length; i++) {
                            const isPlayed = qStates[i];
                            const slotDiv = document.createElement('div');
                            
                            if (isPlayed) {
                                slotDiv.className = 'progress-slot played-slot';
                                slotDiv.innerHTML = `
                                    <img src="played.png" onerror="this.onerror=null;this.style.display='none';this.nextElementSibling.style.display='flex';" alt="Played">
                                    <div class="fallback-bundle" style="display:none;width:100%;height:100%;align-items:center;justify-content:center;background:#fff;">
                                        <svg width="48" height="38" viewBox="0 0 50 40">
                                            <rect x="5" y="10" width="40" height="24" rx="3" fill="#27ae60" stroke="#1e824c" stroke-width="2"/>
                                            <rect x="20" y="10" width="10" height="24" fill="#e74c3c"/>
                                            <circle cx="25" cy="22" r="5" fill="#f1c40f"/>
                                        </svg>
                                    </div>
                                `;
                            } else {
                                slotDiv.className = 'progress-slot unplay-slot';
                                slotDiv.innerHTML = `
                                    <img src="unplay.png" onerror="this.onerror=null;this.style.display='none';" alt="Unplay">
                                    <span class="slot-number">${i + 1}</span>
                                `;
                            }
                            slotsContainer.appendChild(slotDiv);
                        }
                    }

                    const hudEl = document.getElementById('progress-hud-overlay');
                    if (hudEl) hudEl.classList.add('show');
                    break;

                case "hide_progress":
                    const hudElHide = document.getElementById('progress-hud-overlay');
                    if (hudElHide) hudElHide.classList.remove('show');
                    break;

                case "show_winning_money":
                    const winTextEl = document.getElementById('winning-money-text');
                    if (winTextEl && data) {
                        if (data.moneyText) {
                            winTextEl.innerText = data.moneyText;
                        } else if (data.money !== undefined) {
                            winTextEl.innerText = `${data.money.toLocaleString('vi-VN')} $A`;
                        }
                    }
                    const winOverlayShow = document.getElementById('winning-money-overlay');
                    if (winOverlayShow) winOverlayShow.classList.add('show');
                    const bgMainShow = document.querySelector('.bg-main');
                    if (bgMainShow) bgMainShow.classList.add('hide');

                    const centralBoxWin = document.getElementById('central-box');
                    if (centralBoxWin) centralBoxWin.classList.remove('show');
                    const ansWin = document.getElementById('answers-container');
                    if (ansWin) ansWin.style.display = 'none';
                    break;

                case "hide_winning_money":
                case "collect_winning":
                    const winOverlayHide = document.getElementById('winning-money-overlay');
                    if (winOverlayHide) winOverlayHide.classList.remove('show');
                    const bgMainHide = document.querySelector('.bg-main');
                    if (bgMainHide) bgMainHide.classList.remove('hide');
                    const ansRestore = document.getElementById('answers-container');
                    if (ansRestore) ansRestore.style.display = 'flex';
                    break;

                case "open_door":
                    if (data && data.doorId) {
                        let frameId = data.doorId;
                        if (frameId) {
                            const frameEl = document.getElementById(`proj-frame-${frameId}`);
                            if (frameEl) {
                                frameEl.classList.add("dropped");
                            }
                        }
                    }
                    break;

                case "change_round":
                    if (data) {
                        currentRound = parseInt(data.roundNum || data.round) || 1;
                        if (currentRound === 8) {
                            // Auto shift answers if they were previously placed in proj-ans-1/2
                            const a1 = document.getElementById("proj-ans-1");
                            const a2 = document.getElementById("proj-ans-2");
                            const a3 = document.getElementById("proj-ans-3");
                            if (a1 && a1.innerText && a1.innerText !== "---" && (!a3 || !a3.innerText || a3.innerText === "---")) {
                                if (a3) a3.innerText = a2.innerText;
                                if (a2) a2.innerText = a1.innerText;
                                if (a1) a1.innerText = "---";
                                if (a1) delete a1.dataset.hiddenByContent;
                                if (a2) delete a2.dataset.hiddenByContent;
                                if (a3) delete a3.dataset.hiddenByContent;
                            }
                        }
                        applyAnswerVisibility();
                    }
                    break;

                case "show_topics":
                    const bgMain = document.querySelector('.bg-main');
                    if (bgMain) {
                        bgMain.classList.add("hide");
                    }

                    document.querySelector("#item-a .strap-text").innerText = data.topicA || "CHỦ ĐỀ A";
                    document.querySelector("#item-b .strap-text").innerText = data.topicB || "CHỦ ĐỀ B";
                    
                    const itemA = document.getElementById("item-a");
                    const itemB = document.getElementById("item-b");

                    itemA.style.display = "block";
                    itemB.style.display = "block";

                    itemA.classList.add("zoom-out");
                    itemB.classList.add("zoom-out");
                    itemA.classList.remove("is-active");
                    itemB.classList.remove("is-active");
                    itemA.setAttribute("data-state", "0");
                    itemB.setAttribute("data-state", "0");

                    void itemA.offsetWidth;
                    setTimeout(() => {
                        itemA.classList.remove("zoom-out");
                        itemB.classList.remove("zoom-out");
                    }, 50);
                    break;

                case "lock_topic":
                    const elA = document.getElementById("item-a");
                    const elB = document.getElementById("item-b");
                    if (data.type === "A") {
                        elB.classList.add("zoom-out");
                        elA.classList.add("is-active");
                        elA.setAttribute("data-state", "1");
                    } else {
                        elA.classList.add("zoom-out");
                        elB.classList.add("is-active");
                        elB.setAttribute("data-state", "1");
                    }
                    break;

                case "show_media":
                    const bgMainMedia = document.querySelector('.bg-main');
                    if (bgMainMedia) bgMainMedia.classList.add("hide");
                    document.getElementById("item-a").classList.add("zoom-out");
                    document.getElementById("item-b").classList.add("zoom-out");
                    updateProjectorMediaStage('center', data);
                    break;

                case "update_content":
                    if (data.type === 'question') {
                        document.getElementById("item-a").classList.add("zoom-out");
                        document.getElementById("item-b").classList.add("zoom-out");
                        
                        document.getElementById("central-box").innerText = data.data.question;
                        
                        const mType = data.mediaType || (data.data && data.data.mediaType) || 'none';
                        const mUrl = data.mediaUrl || (data.data && data.data.mediaUrl) || '';
                        const mKey = data.mediaKey || (data.data && data.data.mediaKey) || 'active_main_media';

                        if (mType !== 'none' && (mUrl || mKey)) {
                            updateProjectorMediaStage('left', { mediaType: mType, mediaUrl: mUrl, mediaKey: mKey });
                        } else if (currentMediaState && currentMediaState.type !== 'none' && currentMediaState.url) {
                            updateProjectorMediaStage('left');
                        } else {
                            setTimeout(() => {
                                document.getElementById("central-box").classList.add("show");
                            }, 600);
                        }
                    }
                    break;

                case "update_single_answer":
                    let targetId = data.id;
                    if (targetId) {
                        const ansEl = document.getElementById(`proj-ans-${targetId}`);
                        if (ansEl) {
                            ansEl.innerText = data.text;
                            if (!data.text || data.text.trim() === "") {
                                ansEl.dataset.hiddenByContent = "true";
                            } else {
                                delete ansEl.dataset.hiddenByContent;
                            }
                        }
                    }
                    applyAnswerVisibility();
                    break;

                case "show_all_q_and_a":
                    // Hide topics
                    document.getElementById("item-a").classList.add("zoom-out");
                    document.getElementById("item-b").classList.add("zoom-out");
                    
                    if (currentMediaState && currentMediaState.type !== 'none' && currentMediaState.url) {
                        updateProjectorMediaStage('left-compact');
                    } else {
                        const box = document.getElementById('central-box');
                        const ans = document.getElementById('answers-container');
                        box.classList.add('move-up');
                        box.classList.add('show');
                        ans.classList.add('show');
                    }
                    break;

                case "timer_tick":
                    let m = Math.floor(data.time / 60);
                    let s = data.time % 60;
                    document.getElementById("clock-time").innerText = m + ":" + s.toString().padStart(2, "0");
                    break;

                case "timer_control":
                    if (data.status === "start") {
                        if (clockHideTimeout) {
                            clearTimeout(clockHideTimeout);
                            clockHideTimeout = null;
                        }
                        stopAllSfxOnProjector();
                        const sfxFile = (currentRound === 8 || data.round === 8) ? "SFX/drop_timer_q8.mp3" : "SFX/drop_timer.mp3";
                        timerAudio.src = sfxFile;
                        timerAudio.volume = globalVolume;
                        timerAudio.currentTime = 0;
                        timerAudio.play().catch(e => console.log("Audio play blocked/failed:", e));
                        document.getElementById("clock-container").classList.add("show");
                    } else if (data.status === "add30") {
                        if (clockHideTimeout) {
                            clearTimeout(clockHideTimeout);
                            clockHideTimeout = null;
                        }
                        document.getElementById("clock-container").classList.add("show");
                    } else if (data.status === "stop") {
                        timerAudio.pause();
                        timerAudio.currentTime = 0;
                        if (clockHideTimeout) {
                            clearTimeout(clockHideTimeout);
                        }
                        clockHideTimeout = setTimeout(() => {
                            document.getElementById("clock-container").classList.remove("show");
                            clockHideTimeout = null;
                        }, 3000);
                    } else if (data.status === "timeout") {
                        // Do NOT stop timerAudio on timeout (let music play out)
                        if (clockHideTimeout) {
                            clearTimeout(clockHideTimeout);
                        }
                        clockHideTimeout = setTimeout(() => {
                            document.getElementById("clock-container").classList.remove("show");
                            clockHideTimeout = null;
                        }, 3000);
                    }
                    break;
            }
        };

        function processClick(el) {
            let state = parseInt(el.getAttribute('data-state'));
            if (state === 0) {
                document.querySelectorAll('.strap-wrapper').forEach(item => { if (item !== el) item.classList.add('zoom-out'); });
                el.classList.add('is-active');
                el.setAttribute('data-state', '1');
            } else if (state === 1) {
                el.classList.add('zoom-out');
                setTimeout(() => { document.getElementById('central-box').classList.add('show'); }, 600);
                el.setAttribute('data-state', '2');
            }
        }

        function showAnswers() {
            const box = document.getElementById('central-box');
            const ans = document.getElementById('answers-container');
            const clock = document.getElementById('clock-container');

            if (clickCount === 0) {
                box.classList.remove('show');
                setTimeout(() => {
                    box.classList.add('move-up');
                    box.classList.add('show');
                    ans.classList.add('show');
                    clickCount++;
                }, 600);
            } else {
                clock.classList.add('show');
            }
        }

        // Initialize reset on page load
        resetBigscreen();
        try {
            const savedSettings = localStorage.getItem('game_settings');
            if (savedSettings) {
                applyScreenFramesVisibility(JSON.parse(savedSettings));
            }
        } catch(e) {}
    </script>
</body>
</html>
